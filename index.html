<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sustrain - State B Sandbox</title>
    <!-- iOS Standalone App UI Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sustrain">
    <!-- Tailwind CSS for modern layout design -->
    <script src="https://tailwindcss.com"></script>
    <!-- p5.js for cross-platform generative visuals -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-[#02030c] text-slate-200 min-h-screen flex flex-col justify-between items-center overflow-hidden font-sans select-none">

    <!-- Header Block -->
    <header class="w-full py-4 text-center border-b border-blue-950/40 bg-[#02030c]/80 backdrop-blur z-20">
        <h1 class="text-xl font-bold tracking-[0.2em] text-blue-400 uppercase">Sustrain</h1>
        <p class="text-xs text-slate-500 mt-0.5">Somatic Wave Architecture • State B</p>
    </header>

    <!-- Main Rendering Workspace -->
    <main class="relative w-full flex-1 flex justify-center items-center overflow-hidden">
        <!-- p5.js Canvas Wrapper -->
        <div id="canvas-container" class="absolute inset-0 w-full h-full flex justify-center items-center z-0"></div>

        <!-- Interactive Core Trigger Overlay -->
        <div class="relative z-10 flex flex-col items-center gap-6 max-w-sm w-full px-6 text-center">
            <button id="start-btn" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-full font-bold text-sm tracking-wider uppercase shadow-xl shadow-blue-500/20 border border-blue-400/30">
                Initialize Sound World
            </button>
            <p id="status-text" class="text-xs text-slate-400 font-mono opacity-80 max-w-[240px] bg-slate-950/60 px-4 py-2 rounded-xl backdrop-blur-sm border border-blue-950/30">
                Audio & visuals offline.<br>Connect headphones and tap to boot.
            </p>
        </div>
    </main>

    <!-- Bottom Adjustment Deck (Touch Responsive Sliders) -->
    <footer class="w-full p-6 bg-gradient-to-t from-[#02030c] via-[#02030c]/90 to-transparent z-20 max-w-md">
        <div class="space-y-5 bg-slate-900/60 border border-blue-950/50 rounded-2xl p-5 backdrop-blur-md shadow-2xl">
            <!-- X-Axis Control Grid -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold tracking-wider text-slate-400">
                    <span class="uppercase">Swell Density (X)</span>
                    <span id="x-val" class="font-mono text-blue-400">50%</span>
                </div>
                <input id="slider-x" type="range" min="0" max="100" value="50" class="w-full h-1.5 bg-blue-950 rounded-lg appearance-none cursor-pointer accent-blue-500 transition-all">
            </div>

            <!-- Y-Axis Control Grid -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold tracking-wider text-slate-400">
                    <span class="uppercase">Pleasure Intensity (Y)</span>
                    <span id="y-val" class="font-mono text-blue-400">50%</span>
                </div>
                <input id="slider-y" type="range" min="0" max="100" value="50" class="w-full h-1.5 bg-blue-950 rounded-lg appearance-none cursor-pointer accent-blue-500 transition-all">
            </div>
        </div>
    </footer>

    <!-- Interactive Execution Layer -->
    <script>
        let audioCtx = null;
        let isEngineActive = false;
        let tweakX = 0.5;
        let tweakY = 0.5;
        let wakeLock = null;
        
        let masterGain, basePulseOsc, analGrovelOsc, brownNoiseNode, brownNoiseFilter, erectIndicatorOsc, erectGain;
        let globalIntroFade = 0;
        let waveTimeline = 0;

        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const sliderX = document.getElementById('slider-x');
        const sliderY = document.getElementById('slider-y');
        const xValText = document.getElementById('x-val');
        const yValText = document.getElementById('y-val');

        // Wake Lock API handles keeping mobile displays active during hands-free sessions
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn(`Wake lock error: ${err.message}`);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        });

        function initAudioEngine() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime); 
            masterGain.connect(audioCtx.destination);

            // 55Hz Somatic Pulse Generator
            basePulseOsc = audioCtx.createOscillator();
            basePulseOsc.type = 'sine';
            basePulseOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            let pulseGain = audioCtx.createGain();
            pulseGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            basePulseOsc.connect(pulseGain);
            pulseGain.connect(masterGain);

            // 35Hz Grounding/Anus Pelvic Vibrator
            analGrovelOsc = audioCtx.createOscillator();
            analGrovelOsc.type = 'sine';
            analGrovelOsc.frequency.setValueAtTime(35, audioCtx.currentTime);
            let grovelGain = audioCtx.createGain();
            grovelGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            analGrovelOsc.connect(grovelGain);
            grovelGain.connect(masterGain);

            // Velvet Noise Engine Buffer
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            brownNoiseNode = audioCtx.createBufferSource();
            brownNoiseNode.buffer = noiseBuffer;
            brownNoiseNode.loop = true;

            brownNoiseFilter = audioCtx.createBiquadFilter();
            brownNoiseFilter.type = 'lowpass';
            brownNoiseFilter.frequency.setValueAtTime(240, audioCtx.currentTime);
            
            let noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            
            brownNoiseNode.connect(brownNoiseFilter);
            brownNoiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);

            // Rare 12kHz Tension Peak Shimmer Node
            erectIndicatorOsc = audioCtx.createOscillator();
            erectIndicatorOsc.type = 'sine';
            erectIndicatorOsc.frequency.setValueAtTime(12000, audioCtx.currentTime);
            erectGain = audioCtx.createGain();
            erectGain.gain.setValueAtTime(0, audioCtx.currentTime);
            
            erectIndicatorOsc.connect(erectGain);
            erectGain.connect(masterGain);

            basePulseOsc.start();
            analGrovelOsc.start();
            brownNoiseNode.start();
            erectIndicatorOsc.start();

            // 12-Second Master Entrance Linear Fade
            masterGain.gain.linearRampToValueAtTime(0.75, audioCtx.currentTime + 12.0);

            runMacroTimelineAutomations();
        }

        function runMacroTimelineAutomations() {
            setInterval(() => {
                if (!isEngineActive) return;
                let now = audioCtx.currentTime;
                analGrovelOsc.frequency.setValueAtTime(35, now);
                analGrovelOsc.frequency.exponentialRampToValueAtTime(24, now + 6.0);
                analGrovelOsc.frequency.setValueAtTime(24, now + 10.0);
                analGrovelOsc.frequency.exponentialRampToValueAtTime(35, now + 16.0);
            }, 45000);

            setInterval(() => {
                if (!isEngineActive) return;
                let now = audioCtx.currentTime;
                erectGain.gain.setValueAtTime(0, now);
                erectGain.gain.linearRampToValueAtTime(0.02, now + 2.0);
                erectIndicatorOsc.frequency.setValueAtTime(12000, now);
                erectIndicatorOsc.frequency.linearRampToValueAtTime(14500, now + 6.0);
                erectGain.gain.setValueAtTime(0.02, now + 8.0);
                erectGain.gain.linearRampToValueAtTime(0, now + 12.0);
            }, 75000);
        }

        startBtn.addEventListener('click', async () => {
            if (!isEngineActive) {
                initAudioEngine();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                requestWakeLock();
                isEngineActive = true;
                startBtn.classList.add('hidden');
                statusText.innerHTML = "Somatic engine active.<br>Swells generating client-side.";
            }
        });

        sliderX.addEventListener('input', (e) => {
            tweakX = e.target.value / 100;
            xValText.innerText = `${e.target.value}%`;
            if (isEngineActive && audioCtx) {
                let targetFreq = mapRange(tweakX, 0, 1, 40, 75);
