    <script>
        let audioCtx = null;
        let isEngineActive = false;
        let tweakX = 0.5;
        let tweakY = 0.5;
        let wakeLock = null;
        
        let masterGain, basePulseOsc, analGrovelOsc, brownNoiseNode, brownNoiseFilter, erectIndicatorOsc, erectGain;
        let globalIntroFade = 0;
        let waveTimeline = 0;

        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const sliderX = document.getElementById('slider-x');
        const sliderY = document.getElementById('slider-y');
        const xValText = document.getElementById('x-val');
        const yValText = document.getElementById('y-val');

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) { console.warn(err.message); }
        }

        function initAudioEngine() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime); 
            masterGain.connect(audioCtx.destination);

            basePulseOsc = audioCtx.createOscillator();
            basePulseOsc.type = 'sine';
            basePulseOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            let pulseGain = audioCtx.createGain();
            pulseGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            basePulseOsc.connect(pulseGain); pulseGain.connect(masterGain);

            analGrovelOsc = audioCtx.createOscillator();
            analGrovelOsc.type = 'sine';
            analGrovelOsc.frequency.setValueAtTime(35, audioCtx.currentTime);
            let grovelGain = audioCtx.createGain();
            grovelGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            analGrovelOsc.connect(grovelGain); grovelGain.connect(masterGain);

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                data[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = data[i];
                data[i] *= 3.5;
            }
            brownNoiseNode = audioCtx.createBufferSource();
            brownNoiseNode.buffer = buffer; brownNoiseNode.loop = true;

            brownNoiseFilter = audioCtx.createBiquadFilter();
            brownNoiseFilter.type = 'lowpass';
            brownNoiseFilter.frequency.setValueAtTime(240, audioCtx.currentTime);
            let noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            
            brownNoiseNode.connect(brownNoiseFilter);
            brownNoiseFilter.connect(noiseGain); noiseGain.connect(masterGain);

            erectIndicatorOsc = audioCtx.createOscillator();
            erectIndicatorOsc.type = 'sine';
            erectIndicatorOsc.frequency.setValueAtTime(12000, audioCtx.currentTime);
            erectGain = audioCtx.createGain(); erectGain.gain.setValueAtTime(0, audioCtx.currentTime);
            erectIndicatorOsc.connect(erectGain); erectGain.connect(masterGain);

            basePulseOsc.start(); analGrovelOsc.start(); brownNoiseNode.start(); erectIndicatorOsc.start();
            masterGain.gain.linearRampToValueAtTime(0.75, audioCtx.currentTime + 12.0);
            runMacroTimelineAutomations();
        }

        function runMacroTimelineAutomations() {
            setInterval(() => {
                if (!isEngineActive) return;
                let now = audioCtx.currentTime;
                analGrovelOsc.frequency.setValueAtTime(35, now);
                analGrovelOsc.frequency.exponentialRampToValueAtTime(24, now + 6.0);
                analGrovelOsc.frequency.setValueAtTime(24, now + 10.0);
                analGrovelOsc.frequency.exponentialRampToValueAtTime(35, now + 16.0);
            }, 45000);

            setInterval(() => {
                if (!isEngineActive) return;
                let now = audioCtx.currentTime;
                erectGain.gain.setValueAtTime(0, now);
                erectGain.gain.linearRampToValueAtTime(0.02, now + 2.0);
                erectIndicatorOsc.frequency.setValueAtTime(12000, now);
                erectIndicatorOsc.frequency.linearRampToValueAtTime(14500, now + 6.0);
                erectGain.gain.setValueAtTime(0.02, now + 8.0);
                erectGain.gain.linearRampToValueAtTime(0, now + 12.0);
            }, 75000);
        }

        startBtn.addEventListener('click', async () => {
            if (!isEngineActive) {
                initAudioEngine();
                if (audioCtx && audioCtx.state === 'suspended') { await audioCtx.resume(); }
                requestWakeLock(); isEngineActive = true;
                startBtn.classList.add('hidden');
                statusText.innerHTML = "Somatic engine active.<br>Swells generating client-side.";
            }
        });

        sliderX.addEventListener('input', (e) => {
            tweakX = e.target.value / 100; xValText.innerText = e.target.value + "%";
            if (isEngineActive && audioCtx) {
                let targetFreq = (tweakX * 35) + 40;
                basePulseOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            }
        });

        sliderY.addEventListener('input', (e) => {
            tweakY = e.target.value / 100; yValText.innerText = e.target.value + "%";
            if (isEngineActive && audioCtx) {
                let targetCutoff = (tweakY * 360) + 120;
                brownNoiseFilter.frequency.setTargetAtTime(targetCutoff, audioCtx.currentTime, 0.2);
            }
        });
        const sketch = (p) => {
            let maxRadius;
            p.setup = () => {
                let container = document.getElementById('canvas-container');
                let cnv = p.createCanvas(container.offsetWidth, container.offsetHeight);
                cnv.parent('canvas-container'); p.frameRate(30);
                maxRadius = p.min(p.width, p.height) * 0.35;
                p.background(2, 3, 12);
            };
            p.windowResized = () => {
                let container = document.getElementById('canvas-container');
                p.resizeCanvas(container.offsetWidth, container.offsetHeight);
                maxRadius = p.min(p.width, p.height) * 0.35;
            };
            p.draw = () => {
                p.background(2, 3, 12);
                if (isEngineActive && globalIntroFade < 1.0) { globalIntroFade += 0.003; }
                waveTimeline += 0.005; p.translate(p.width / 2, p.height / 2);
                let totalWaveBands = 40;
                let simulatedSubSwell = p.pow(p.map(p.sin(p.frameCount * 0.035), -1, 1, 0, 1), 4);
                let simulatedHighErect = p.pow(p.map(p.cos(p.frameCount * 0.02), -1, 1, 0, 1), 6);
                p.noFill();
                for (let i = 0; i < totalWaveBands; i++) {
                    let progress = i / totalWaveBands; let currentRadius = progress * maxRadius;
                    let waveDeformA = p.sin(progress * p.TWO_PI * 2.5 - waveTimeline * 1.5);
                    let waveDeformB = p.cos(progress * p.PI + waveTimeline * 1.0);
                    let edgeFade = p.sin(progress * p.PI);
                    
                    let currentAlpha = isEngineActive ? globalIntroFade : 0.4;
                    let dynamicAlpha = p.pow(edgeFade, 1.6) * 190.0 * currentAlpha;
                    
                    let colorNoise = p.noise(i * 0.04, waveTimeline * 0.2);
                    let r = p.int(p.map(colorNoise, 0, 1, 0, 5));
                    let g = p.int(p.map(colorNoise, 0, 1, 25, 120) + (simulatedHighErect * 80));
                    let b = p.int(p.map(progress, 0, 1, 130, 255));
                    p.stroke(r, g, b, dynamicAlpha);
                    p.strokeWeight(p.map(progress, 0, 1, 0.8, 3.5) + (simulatedSubSwell * 2.5));
                    p.beginShape();
                    let wavePoints = 60;
                    for (let j = 0; j <= wavePoints; j++) {
                        let theta = (j / wavePoints) * p.TWO_PI;
                        let jitter = p.sin(theta * 24.0 + p.frameCount) * (simulatedHighErect * 1.8);
                        
                        let cosX = p.cos(theta) * 0.4 + 1.0;
                        let sinY = p.sin(theta) * 0.4 + 1.0;
                        if (cosX < 0.1) cosX = 0.1;
                        if (sinY < 0.1) sinY = 0.1;
                        
                        let noiseModifier = p.noise(cosX, sinY, waveTimeline);
                        let totalSwellFactor = 1.0 + (waveDeformA * waveDeformB * 0.07) * (noiseModifier * (tweakX * 1.2));
                        let finalRadius = (currentRadius * totalSwellFactor) + jitter;
                        let x = finalRadius * p.cos(theta); let y = finalRadius * p.sin(theta);
                        p.vertex(x, y);
                    }
                    p.endShape();
                }
                p.resetMatrix(); p.noFill(); p.stroke(2, 3, 12);
                p.strokeWeight(p.max(p.width, p.height) * 0.4);
                p.ellipse(p.width / 2, p.height / 2, p.max(p.width, p.height) + maxRadius * 2, p.max(p.width, p.height) + maxRadius * 2);
            };
        };
        new p5(sketch);
    </script>
</body>
</html>
